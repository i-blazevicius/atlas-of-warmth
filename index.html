<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas of Warmth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..600&family=Noto+Serif:wght@400&family=Noto+Serif+Armenian&family=Noto+Serif+Georgian&family=Noto+Serif+Gurmukhi&family=Noto+Serif+Devanagari&family=Noto+Naskh+Arabic&family=Noto+Sans+Canadian+Aboriginal&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lib/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="lib/papaparse.min.js"></script>
</head>
<body>
  <div id="map"></div>

  <!-- Control panel -->
  <section id="controls" class="controls">
    <h1 class="title">Atlas of Warmth</h1>
    <p class="count" id="count">loading…</p>
    <div class="control-group">
      <span class="control-label">View</span>
      <div class="segmented" role="group" aria-label="Projection">
        <button type="button" data-projection="globe">Globe</button>
        <button type="button" data-projection="mercator">Flat</button>
      </div>
    </div>
    <div class="control-group">
      <span class="control-label">On click</span>
      <div class="segmented" role="group" aria-label="On click">
        <button type="button" data-onclick="fit">Fit extent</button>
        <button type="button" data-onclick="stay">Stay</button>
      </div>
    </div>
    <div class="control-group">
      <span class="control-label">Climate underlay</span>
      <div class="segmented" role="group" aria-label="Climate underlay">
        <button type="button" data-climate="none">None</button>
        <button type="button" data-climate="hdd">Heating</button>
        <button type="button" data-climate="continentality">Continental</button>
      </div>
      <div class="climate-detail" id="climate-detail" hidden>
        <p class="climate-title" id="climate-title"></p>
        <div class="climate-bar" id="climate-bar"></div>
        <div class="climate-ends"><span id="climate-low"></span><span id="climate-high"></span></div>
        <label class="climate-opacity">Opacity <input type="range" id="climate-opacity" min="0" max="1" step="0.05"></label>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="filter-stories"> Only types with stories</label>
    <label class="check"><input type="checkbox" id="filter-images"> Only types with images</label>
    <div class="legend">
      
      <span><i class="swatch core"></i>Widely used</span>
      <span><i class="swatch fringe"></i>Less prevalent / likely</span>
    </div>
  </section>

  <!-- Type info panel -->
  <aside id="panel" class="panel" hidden>
    <button type="button" class="close" data-close="panel" aria-label="Close">×</button>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <!-- Story panel -->
  <aside id="story" class="panel story" hidden>
    <button type="button" class="close" data-close="story" aria-label="Close">×</button>
    <div class="panel-body" id="story-body"></div>
  </aside>

  <div id="message" class="message" hidden></div>
  <p id="credit" class="credit" hidden></p>

  <script type="module" src="js/app.js"></script>
</body>
</html>
