<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas of Warmth · print</title>
  <!-- Fonts, the last-used style (page hidden until it is on), the stylesheets and the error box: js/head.js -->
  <script src="js/head.js" data-css="css/style.css css/print.css"></script>
  <script src="lib/papaparse.min.js"></script>
</head>
<body class="print-page">
  <!-- Settings bar: on screen only, never printed. Starting values are in js/config.js → print. -->
  <header class="print-bar" id="print-bar">
    <strong>Print cards</strong>
    <label>Style <select id="p-style"></select></label>
    <label>Order <select id="p-order">
      <option value="family">By family</option>
      <option value="west-east">West to east</option>
      <option value="id">By ID</option>
      <option value="random">Random</option>
    </select></label>
    <label>Paper <select id="p-paper">
      <option value="auto">Smallest that fits</option>
      <option>A4</option><option>A3</option><option>A2</option><option>A1</option><option>A0</option>
    </select></label>
    <label>Card width <input type="number" id="p-width" min="40" max="200" step="1"> mm</label>
    <label class="check"><input type="checkbox" id="p-images"> Only hearths with images</label>
    <label class="check"><input type="checkbox" id="p-empty"> Frame for missing images</label>
    <span class="print-info" id="p-info">loading…</span>
    <details class="problems" id="p-problems" hidden></details>
    <button type="button" id="p-print">Print / save as PDF</button>
  </header>
  <main id="sheets" class="sheets"></main>

  <!-- Loads js/config.js and js/print.js fresh on every visit (js/head.js). -->
  <script>atlasStart('print');</script>
</body>
</html>
